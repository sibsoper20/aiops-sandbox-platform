apiVersion: rbac.authorization.k8s.io/v1
kind: ClusterRole
metadata:
  name: softcon-alloy-pod-logs
  labels:
    app.kubernetes.io/part-of: softcon-aiops-demo
rules:
  - apiGroups: [""]
    resources: ["pods"]
    verbs: ["get", "list", "watch"]
  - apiGroups: [""]
    resources: ["pods/log"]
    verbs: ["get"]
---
apiVersion: rbac.authorization.k8s.io/v1
kind: ClusterRoleBinding
metadata:
  name: softcon-alloy-pod-logs
  labels:
    app.kubernetes.io/part-of: softcon-aiops-demo
subjects:
  - kind: ServiceAccount
    name: alloy
    namespace: observability
roleRef:
  apiGroup: rbac.authorization.k8s.io
  kind: ClusterRole
  name: softcon-alloy-pod-logs
