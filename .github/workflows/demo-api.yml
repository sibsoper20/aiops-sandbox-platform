name: Demo API

on:
  push:
    branches:
      - softcon-2027
    paths:
      - "apps/demo-api/**"
      - ".github/workflows/demo-api.yml"
  pull_request:
    paths:
      - "apps/demo-api/**"
      - ".github/workflows/demo-api.yml"
  workflow_dispatch:

permissions:
  contents: read
  packages: write

jobs:
  test:
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: apps/demo-api
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-go@v6
        with:
          go-version: "1.27.0"
          cache-dependency-path: |
            apps/demo-api/go.mod
            apps/demo-api/go.sum
      - name: Resolve dependencies
        run: go mod tidy
      - name: Format check
        run: test -z "$(gofmt -l .)"
      - name: Test
        run: go test -race -cover ./...
      - name: Vet
        run: go vet ./...

  container:
    if: github.event_name != 'pull_request'
    needs: test
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: docker/setup-buildx-action@v3
      - uses: docker/login-action@v3
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}
      - uses: docker/metadata-action@v5
        id: meta
        with:
          images: ghcr.io/${{ github.repository }}/demo-api
          tags: |
            type=raw,value=softcon-2027
            type=sha
      - uses: docker/build-push-action@v6
        with:
          context: apps/demo-api
          push: true
          tags: ${{ steps.meta.outputs.tags }}
          labels: ${{ steps.meta.outputs.labels }}
