apiVersion: apps/v1
kind: Deployment
metadata:
  name: foundation-test
  namespace: demo
  labels:
    app.kubernetes.io/name: foundation-test
    app.kubernetes.io/part-of: softcon-aiops-demo
spec:
  replicas: 1
  selector:
    matchLabels:
      app.kubernetes.io/name: foundation-test
  template:
    metadata:
      labels:
        app.kubernetes.io/name: foundation-test
        app.kubernetes.io/part-of: softcon-aiops-demo
    spec:
      containers:
        - name: web
          image: nginx:stable-alpine
          ports:
            - name: http
              containerPort: 80
          resources:
            requests:
              cpu: 25m
              memory: 32Mi
            limits:
              cpu: 100m
              memory: 64Mi
          readinessProbe:
            httpGet:
              path: /
              port: http
            initialDelaySeconds: 2
            periodSeconds: 5
          livenessProbe:
            httpGet:
              path: /
              port: http
            initialDelaySeconds: 10
            periodSeconds: 10
---
apiVersion: v1
kind: Service
metadata:
  name: foundation-test
  namespace: demo
spec:
  selector:
    app.kubernetes.io/name: foundation-test
  ports:
    - name: http
      port: 80
      targetPort: http
---
apiVersion: networking.k8s.io/v1
kind: Ingress
metadata:
  name: foundation-test
  namespace: demo
spec:
  rules:
    - host: aiops-demo.local
      http:
        paths:
          - path: /
            pathType: Prefix
            backend:
              service:
                name: foundation-test
                port:
                  name: http
